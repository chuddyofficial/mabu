<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-labelledby="mabuLogoTitle">
  <title id="mabuLogoTitle">МАБУ cyber team</title>
  <style>
    .mabuLogo-cursor { animation: mabuLogoBlink 1.1s steps(1) infinite; }
    .mabuLogo-sweep { animation: mabuLogoSweep 5.5s ease-in-out infinite; }
    @keyframes mabuLogoBlink { 50% { opacity: 0; } }
    @keyframes mabuLogoSweep { 0% { transform: translateY(0); opacity: 0; } 10% { opacity: 1; } 90% { opacity: 1; } 100% { transform: translateY(440px); opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .mabuLogo-cursor, .mabuLogo-sweep { animation: none; } .mabuLogo-sweep { opacity: 0; } }
  </style>
  <defs>
    <radialGradient id="mabuLogoBody" cx="50%" cy="38%" r="70%">
      <stop offset="0" stop-color="#0b2a15"/>
      <stop offset="0.55" stop-color="#04120a"/>
      <stop offset="1" stop-color="#010603"/>
    </radialGradient>
    <linearGradient id="mabuLogoRim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b6ffd0"/>
      <stop offset="0.35" stop-color="#00ff66"/>
      <stop offset="1" stop-color="#008f3c"/>
    </linearGradient>
    <linearGradient id="mabuLogoInk" gradientUnits="userSpaceOnUse" x1="0" y1="244" x2="0" y2="311.84">
      <stop offset="0" stop-color="#d4ffe2"/>
      <stop offset="0.4" stop-color="#3dff8c"/>
      <stop offset="1" stop-color="#00c853"/>
    </linearGradient>
    <linearGradient id="mabuLogoSweepGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#00ff66" stop-opacity="0"/>
      <stop offset="1" stop-color="#00ff66" stop-opacity="0.14"/>
    </linearGradient>
    <filter id="mabuLogoGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="mabuLogoGlowSoft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="mabuLogoHalo" x="-15%" y="-15%" width="130%" height="130%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <pattern id="mabuLogoHoneycomb" width="15.59" height="27" patternUnits="userSpaceOnUse">
      <g fill="none" stroke="#00ff66" stroke-width="0.6" opacity="0.07">
        <polygon points="7.79,0 15.59,4.5 15.59,13.5 7.79,18 0,13.5 0,4.5"/>
        <polygon points="15.59,13.5 23.38,18 23.38,27 15.59,31.5 7.79,27 7.79,18"/>
        <polygon points="0,13.5 7.79,18 7.79,27 0,31.5 -7.79,27 -7.79,18"/>
      </g>
    </pattern>
    <pattern id="mabuLogoScan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1.6" fill="#000" opacity="0.28"/>
    </pattern>
    <clipPath id="mabuLogoInside"><polygon points="256,30 451.72,143 451.72,369 256,482 60.28,369 60.28,143"/></clipPath>
  </defs>

  <!-- outer halo so the badge lifts off both light and dark pages -->
  <polygon points="256,16 463.85,136 463.85,376 256,496 48.15,376 48.15,136" fill="#00ff66" opacity="0.28" filter="url(#mabuLogoHalo)"/>

  <!-- badge body -->
  <polygon points="256,16 463.85,136 463.85,376 256,496 48.15,376 48.15,136" fill="#010603"/>
  <polygon points="256,30 451.72,143 451.72,369 256,482 60.28,369 60.28,143" fill="url(#mabuLogoBody)"/>
  <g clip-path="url(#mabuLogoInside)">
    <rect width="512" height="512" fill="url(#mabuLogoHoneycomb)"/>
    <rect class="mabuLogo-sweep" x="0" y="-60" width="512" height="60" fill="url(#mabuLogoSweepGrad)"/>
  </g>

  <!-- rim: bright outer frame, fine inner line, instrument ticks -->
  <polygon points="256,16 463.85,136 463.85,376 256,496 48.15,376 48.15,136" fill="none" stroke="url(#mabuLogoRim)" stroke-width="7" stroke-linejoin="miter" filter="url(#mabuLogoGlowSoft)"/>
  <polygon points="256,42 441.33,149 441.33,363 256,470 70.67,363 70.67,149" fill="none" stroke="#00ff66" stroke-width="1.4" opacity="0.45"/>
  <polygon points="256,56 429.21,156 429.21,356 256,456 82.79,356 82.79,156" fill="none" stroke="#00ff66" stroke-width="5" stroke-dasharray="1.4 11" opacity="0.28"/>
  <g fill="#00ff66">
    <rect x="252.5" y="38.5" width="7" height="7" transform="rotate(45 256 42)"/>
    <rect x="437.83" y="145.5" width="7" height="7" transform="rotate(45 441.33 149)"/>
    <rect x="437.83" y="359.5" width="7" height="7" transform="rotate(45 441.33 363)"/>
    <rect x="252.5" y="466.5" width="7" height="7" transform="rotate(45 256 470)"/>
    <rect x="67.17" y="359.5" width="7" height="7" transform="rotate(45 70.67 363)"/>
    <rect x="67.17" y="145.5" width="7" height="7" transform="rotate(45 70.67 149)"/>
  </g>

  <!-- the eye: open-source intelligence, locked in a targeting reticle -->
  <g fill="none" stroke="#00ff66" stroke-linecap="square">
    <g stroke-width="3" opacity="0.75">
      <path d="M130 122V106h16M382 122V106h-16M130 194V210h16M382 194V210h-16"/>
    </g>
    <g stroke-width="2" opacity="0.55">
      <path d="M134 158H150M362 158H378M256 110V118M256 198V206"/>
    </g>
    <g filter="url(#mabuLogoGlowSoft)">
      <path stroke="url(#mabuLogoRim)" stroke-width="5" stroke-linejoin="miter" d="M160 158Q256 98 352 158Q256 218 160 158z"/>
      <circle cx="256" cy="158" r="21" stroke-width="4"/>
    </g>
    <circle cx="256" cy="158" r="14" stroke-width="1.2" stroke-dasharray="2 3.5" opacity="0.7"/>
  </g>
  <polygon points="256,149.5 263.36,153.75 263.36,162.25 256,166.5 248.64,162.25 248.64,153.75" fill="#b6ffd0" filter="url(#mabuLogoGlowSoft)"/>

  <!-- wordmark: МАБУ, drawn as geometry so it never depends on installed fonts -->
  <g fill="url(#mabuLogoInk)" filter="url(#mabuLogoGlow)">
    <path transform="translate(105.48 244) scale(1.06)" d="M0 64V0h12l14 20 14-20h12v64H40V22L26 42 12 22v42z"/>
    <path transform="translate(175.44 244) scale(1.06)" d="M0 64V12L12 0h28l12 12v52H40V40H12v24zM12 17l5-5h18l5 5v11H12z"/>
    <path transform="translate(245.4 244) scale(1.06)" d="M0 0h52v12H12v14h28l12 12v14L40 64H0zM12 38h23l5 5v4l-5 5H12z"/>
    <path transform="translate(315.36 244) scale(1.06)" d="M0 0h12v26h28V0h12v52L40 64H0V52h40V38H12L0 26z"/>
    <rect class="mabuLogo-cursor" x="381.08" y="299.12" width="25.44" height="12.72"/>
  </g>

  <!-- divider + subtitle -->
  <g stroke="#00ff66" stroke-width="1.6" opacity="0.6">
    <path d="M138 334H244M268 334H374"/>
  </g>
  <rect x="251.5" y="329.5" width="9" height="9" fill="#00ff66" transform="rotate(45 256 334)"/>
  <g fill="none" stroke="#9dffc0" stroke-width="1.7" stroke-linecap="square" stroke-linejoin="miter">
    <path transform="translate(165.55 358) scale(1.35)" d="M8 0H0v12h8"/>
    <path transform="translate(184.45 358) scale(1.35)" d="M0 0l4 6 4-6M4 6v6"/>
    <path transform="translate(203.35 358) scale(1.35)" d="M0 0v12h6l2-2V8L6 6l2-2V2L6 0zM0 6h6"/>
    <path transform="translate(222.25 358) scale(1.35)" d="M8 0H0v12h8M0 6h6"/>
    <path transform="translate(241.15 358) scale(1.35)" d="M0 12V0h6l2 2v2L6 6H0M4 6l4 6"/>
    <path transform="translate(278.95 358) scale(1.35)" d="M0 0h8M4 0v12"/>
    <path transform="translate(297.85 358) scale(1.35)" d="M8 0H0v12h8M0 6h6"/>
    <path transform="translate(316.75 358) scale(1.35)" d="M0 12V3l3-3h2l3 3v9M0 7h8"/>
    <path transform="translate(335.65 358) scale(1.35)" d="M0 12V0l4 5 4-5v12"/>
  </g>

  <!-- status segments -->
  <g fill="#00ff66">
    <rect x="192" y="404" width="14" height="5" opacity="0.9"/>
    <rect x="211" y="404" width="14" height="5" opacity="0.9"/>
    <rect x="230" y="404" width="14" height="5" opacity="0.9"/>
    <rect x="249" y="404" width="14" height="5" opacity="0.9"/>
    <rect x="268" y="404" width="14" height="5" opacity="0.5"/>
    <rect x="287" y="404" width="14" height="5" opacity="0.25"/>
    <rect x="306" y="404" width="14" height="5" opacity="0.12"/>
  </g>

  <!-- CRT scanlines over the badge face -->
  <polygon points="256,30 451.72,143 451.72,369 256,482 60.28,369 60.28,143" fill="url(#mabuLogoScan)"/>
</svg>
